<script>/* iPhone (16/11/2026): sem zoom de pinça e sem o zoom automático ao tocar num campo.
   A pinça é bloqueada pelo gesto; o zoom do campo, travando a escala só enquanto um campo está em foco. */
(function(){['gesturestart','gesturechange'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},{passive:false})});
var m=document.querySelector('meta[name=viewport]'),base=m.content;
document.addEventListener('focusin',function(e){if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName))m.content=base+', maximum-scale=1'},true);
document.addEventListener('focusout',function(){m.content=base},true);
/* app instalado (Tela de Início): altura real da tela, na vertical */
if(navigator.standalone){var R=document.documentElement;R.classList.add('ios-app');var setH=function(){R.style.setProperty('--appH',(innerWidth<innerHeight?Math.max(screen.width,screen.height):Math.min(screen.width,screen.height))+'px')};setH();addEventListener('resize',setH);addEventListener('orientationchange',setH)}})();</script>

@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:300 700;font-display:swap;src:url(fonts/SpaceGrotesk.ttf) format('truetype')}

/* Layout: o app inteiro dentro de um iPhone de 390 px no computador; em tela de celular, ocupa a tela toda. */
:root{

  --btn:#90C1E4;--btn-t:#0E1520;--btc:#F7931A;--warn:#E4CB82;--danger:#EB7A8A;--ok:#79CB9F;

*{box-sizing:border-box}

body{margin:0;background:var(--page);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.stage{display:flex;gap:32px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.side{max-width:300px;display:flex;flex-direction:column;gap:12px;color:var(--fg2);font-size:13px;padding-top:24px}
.side h1{margin:0;font-size:22px;font-weight:500;color:var(--fg)}
.side b{color:var(--fg);font-weight:500}
.side p{margin:0}
.phone{width:390px;max-width:100%;height:844px;border-radius:48px;border:10px solid #070b10;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5);display:flex;flex-direction:column}

@media (max-width:520px){
  body{padding:0}
  .side{display:none}
  .stage{display:block}
  .phone{width:100%;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none}
  .status{display:none}
  #phone .toast{top:calc(4px + env(safe-area-inset-top,0px))}
  /* PWA no iPhone: a barra de status é transparente (black-translucent); o conteúdo começa abaixo dela */
  .phone{padding-top:env(safe-area-inset-top,0px)}
  /* 16/11/2026: o app ocupa a tela inteira e fixo; a página por trás não rola (antes sobrava uma faixa escura embaixo) */
  html,body{overflow:hidden;background:var(--bg)}
  .phone{position:fixed;inset:0;width:auto;height:auto}
  /* app instalado no iPhone: com a barra de status transparente, o iOS informa a tela mais baixa
     (falta a altura da barra de status) e sobrava uma faixa embaixo; usa a altura real da tela */
  html.ios-app .phone{bottom:auto;height:var(--appH,100%)}
}
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px}

/* aviso: no topo, sobre o cabeçalho, sem cobrir os ícones da direita; só o Desfazer recebe toque */
.toast{position:absolute;left:16px;right:64px;top:48px;min-height:44px;border-radius:12px;background:var(--field);border:1px solid rgba(121,203,159,.35);box-shadow:0 12px 28px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px 0 12px;opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .3s var(--ease),transform .3s var(--ease);z-index:40;font-size:13px;line-height:1.25}

.toast.on{opacity:1;transform:none}
.toast.on button{pointer-events:auto}

#phone.sheet-on .toast{right:16px}

.amount{display:flex;align-items:baseline;gap:8px;min-height:66px;padding-top:2px}

.amount .v.empty{color:var(--fb)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}

.view.lan .keys{flex:none}

@media (max-height:700px){.view.lan .amount{height:64px}.view.lan .amount .v{font-size:60px}.view.lan .key{height:40px}.view.lan .cat{min-height:40px}.view.lan{gap:6px}}

<script>
/* ===== PWA: armazenamento (JCDB) e partida =====
   Os dados ficam no IndexedDB (banco do navegador, mais durável que o localStorage). O app continua síncrono por dentro:
   lê e grava numa cópia em memória (JCDB.get, set, del), e cada gravação vai na hora para o IndexedDB, em ordem, numa fila só
   (sem temporizador). A partida lê o banco inteiro antes de o app rodar, por isso o app abre já com os dados.
   Migração: o que estiver no localStorage (chaves jcoldus-app e jcoldus-pin, de antes do PWA) entra no banco se o banco ainda
   não tiver a chave; só depois de gravado sai do localStorage, e os dados do app ficam numa cópia (jcoldus-app-legado).
   Sem IndexedDB (navegador antigo ou bloqueado), segue no localStorage, como antes. */
const JCDB=(()=>{
  const NOME='j-coldus',TB='kv',LEG=['jcoldus-app','jcoldus-pin'],mem=new Map(),sujo=new Map();
  let db=null,fila=Promise.resolve(true),marcado=false;
  const abrir=()=>new Promise((ok,er)=>{let r;try{r=indexedDB.open(NOME,1)}catch(e){er(e);return}
    r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(TB))r.result.createObjectStore(TB)};
    r.onsuccess=()=>{const d=r.result;d.onversionchange=()=>d.close();ok(d)};r.onerror=()=>er(r.error);r.onblocked=()=>er(new Error('banco bloqueado'))});
  const lerTudo=()=>new Promise((ok,er)=>{const t=db.transaction(TB,'readonly'),c=t.objectStore(TB).openCursor();
    c.onsuccess=()=>{const k=c.result;if(k){mem.set(k.key,k.value);k.continue()}};t.oncomplete=()=>ok();t.onerror=()=>er(t.error)});
  const gravar=ops=>new Promise((ok,er)=>{const t=db.transaction(TB,'readwrite',{durability:'strict'}),s=t.objectStore(TB);
    ops.forEach(([k,v])=>v===undefined?s.delete(k):s.put(v,k));t.oncomplete=()=>ok(true);t.onerror=()=>er(t.error);t.onabort=()=>er(t.error||new Error('gravação abortada'))});
  const lsSet=(k,v)=>{try{v===undefined?localStorage.removeItem(k):localStorage.setItem(k,v);return true}catch(e){return false}};
  /* manda o que mudou para o banco; se falhar, o que não foi gravado volta para a fila e vai na próxima gravação */
  function enviar(){marcado=false;if(!sujo.size)return fila;const ops=[...sujo.entries()];sujo.clear();
    if(!db){fila=fila.then(()=>ops.every(([k,v])=>lsSet(k,v)));return fila}
    fila=fila.then(()=>gravar(ops)).catch(e=>{ops.forEach(([k,v])=>{if(!sujo.has(k))sujo.set(k,v)});console.warn('J-Coldus: não gravou no banco',e);return false});return fila}
  function marcar(k,v){sujo.set(k,v);if(!marcado){marcado=true;Promise.resolve().then(enviar)}}
  async function iniciar(){
    try{db=await abrir();await lerTudo()}catch(e){db=null;mem.clear()}
    if(!db){[...LEG,'jcoldus-bio'].forEach(k=>{try{const v=localStorage.getItem(k);if(v!=null)mem.set(k,v)}catch(e){}});return}
    const novos=[];
    LEG.forEach(k=>{let v=null;try{v=localStorage.getItem(k)}catch(e){}if(v!=null&&!mem.has(k)){mem.set(k,v);novos.push([k,v])}});
    if(novos.length){try{await gravar(novos);novos.forEach(([k,v])=>{lsSet(k);if(k==='jcoldus-app')lsSet('jcoldus-app-legado',v)});J.migrou=novos.map(x=>x[0])}catch(e){/* fica no localStorage: tenta de novo na próxima abertura */}}
  }
  const J={get:k=>mem.has(k)?mem.get(k):null,set:(k,v)=>{v=String(v);mem.set(k,v);marcar(k,v);return true},del:k=>{mem.delete(k);marcar(k,undefined)},
    flush:()=>enviar(),iniciar,migrou:[],persistido:null,get banco(){return db?'indexeddb':'localstorage'}};
  return J})();
/* gravação pendente vai antes de o app sair da tela (troca de app, fechar) */
addEventListener('pagehide',()=>JCDB.flush());
document.addEventListener('visibilitychange',()=>{if(document.hidden)JCDB.flush()});
/* pede ao navegador para não apagar os dados sozinho quando faltar espaço (no iPhone, vale para o app da Tela de Início) */
if(navigator.storage&&navigator.storage.persist)navigator.storage.persisted().then(p=>p||navigator.storage.persist()).then(p=>{JCDB.persistido=!!p}).catch(()=>{});
/* service worker: guarda os arquivos do app para abrir sem internet (só em http/https; aberto como arquivo não existe) */
/* só registra na página do próprio app (marca jcoldus-pwa, caminho terminado em / ou index.html), com escopo limitado à pasta dele */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&document.querySelector('meta[name="jcoldus-pwa"]')&&/\/(index\.html)?$/.test(location.pathname))
  addEventListener('load',()=>{const reg=n=>navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(e=>{if(n<2)setTimeout(()=>reg(n+1),2000*(n+1));else console.warn('J-Coldus: service worker não registrou',e)});reg(0)});
/* partida: lê o banco e espera a página terminar de chegar (o script jc-app, abaixo, é grande e pode chegar em partes);
   só então roda o app */
const jcDom=new Promise(ok=>{if(document.readyState!=='loading')ok();else document.addEventListener('DOMContentLoaded',ok,{once:true})});
Promise.all([JCDB.iniciar().catch(()=>{}),jcDom]).then(()=>{const s=document.createElement('script');s.textContent=document.getElementById('jc-app').textContent;document.body.appendChild(s)});
</script>

function chipFade1(c){const f=()=>{const ks=c.querySelectorAll('.chip'),r=c.getBoundingClientRect(),k0=ks[0],k1=ks[ks.length-1];c.classList.toggle('ov',c.scrollWidth>c.clientWidth+1);c.classList.toggle('st',!!k0&&k0.getBoundingClientRect().left<r.left-1);c.classList.toggle('end',!k1||k1.getBoundingClientRect().right<=r.right+1)};
  const pr=[...c.querySelectorAll('.chip[aria-pressed="true"]')].pop();if(pr){const over=pr.offsetLeft+pr.offsetWidth+40-c.clientWidth;if(over>c.scrollLeft)c.scrollLeft=over}

function setCat(cat){L.cat=cat;L.link=null;L.lk='auto';L.fx=null;L.ok2=false;

function saveL(){

  const cc=lcc();

  const t={id:uid(),d:L.d,v:amount,tipo:L.tipo==='in'?'in':'out',meio:L.tipo==='out'||(L.tipo==='in'&&L.cat==='Estorno')?L.meio:padId(),desc};
  let extra='';

  if(L.tipo==='in'){if(L.link){const r=linkTarget(L.link)||{};t.cat='Renda';t.link=L.link;t.desc=desc||r.nome;if(r.meio&&ctById(r.meio))t.meio=r.meio;const rr=calc(cycleOf(L.d)).rendas.find(x=>x.id===r.id);if(rr&&rr.rec)extra=' · soma ao que já entrou'}else{t.cat=L.cat}}
  else if(L.tipo==='tr'){t.cat=L.cat;if(L.cat==='Pagar fatura'&&cc){const pg=pagaDe(cc);t.tipo='tr';t.meio=pg?pg.id:null;t.cc=cc;t.fat=payTarget(cc).id;if(!desc)t.desc='Fatura '+cardOf(cc).nome+' '+fl(fatById(t.fat,cc))}}
  /* v21 lote 3a: parcelado no crédito vira compra parcelada (Cartão) com a categoria escolhida, 1ª parcela na fatura do dia da compra */
  else if(pnOn()){t.cat=L.cat;const p={id:uid(),nome:desc||cn(L.cat),v:Math.round(amount/L.pn*100)/100,n:L.pn,fat1:fatOfDate(L.d,L.meio).id,ant:[],cat:L.cat,cc:L.meio};
    S.cfg.parcelas.push(p);t.pid=p.id;t.pn=L.pn;extra=` · em ${L.pn}× de ${brl(p.v)}`}
  else{t.cat=L.cat;const f=effLink();if(f){t.link='f:'+f.id;extra=' · conta '+f.nome}
    /* conta dividida: se o valor mudou depois de dividir, a minha parte fica e o resto se reparte igual entre as pessoas */
    if(L.div&&L.div.minha<amount-.005){const n=L.div.pes.length,rest=amount-L.div.minha,each=Math.round(rest/n*100)/100,same=Math.abs(L.div.pes.reduce((a,p)=>a+p.v,0)-rest)<.01;
      t.minha=L.div.minha;t.div=L.div.pes.map(p=>({id:uid(),nome:p.nome,v:same?p.v:each,rec:[]}));extra+=' · a receber '+brl(rest)}}
  S.tx.push(t);
  toast(`Salvo: ${brl(amount)} em ${t.cat==='Renda'?t.desc:cn(t.cat)}${extra}`,()=>{dropResto(t);if(t.pid)S.cfg.parcelas=S.cfg.parcelas.filter(p=>p.id!==t.pid);S.tx=S.tx.filter(x=>x.id!==t.id)});

/* gráfico de gastos: dia da semana, semana (segunda a domingo) e mês */
let chMode='dow',chSel=null,chWk=null,chWkNow=null;/* v25: chWk = semana escolhida no "Dia da semana" (null = a de hoje ou a última do ciclo) */
/* gasto variável: mesma regra do "Pode gastar" (sem contas fixas ligadas e sem aporte) */
const isVar=t=>t.tipo==='out'&&!isAp(t)&&!t.link&&!t.pid;
function chartData(cy,isNow){
  const sp=d=>S.tx.filter(t=>t.d===d&&isVar(t)).reduce((a,t)=>a+t.v,0);
  const s=parse(cy.start),e=parse(cy.end),days=[];
  for(let d=new Date(s);d<=e;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1))days.push(iso(d));
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  /* v25: "Dia da semana" = o gasto real de cada dia de UMA semana (segunda a domingo); setas trocam a semana.
     Dia futuro ou fora do ciclo: barra vazia e desabilitada. Média do balão = os outros dias com o mesmo dia da semana
     no ciclo, até ontem (dia sem gasto conta 0), sem o próprio dia */
  if(chMode==='dow'){const W=chWeeks(cy),lim=TODAY<cy.end?TODAY:cy.end;let last=0;W.forEach((w,i)=>{if(w[0]<=lim)last=i});
    const wk=chWk==null?last:Math.max(0,Math.min(last,chWk));chWkNow={wk,last,w:W[wk]};
    const DL=['seg','ter','qua','qui','sex','sáb','dom'],DF=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
    return {bars:W[wk].map((d,i)=>{const ok=inC(d,cy)&&d<=TODAY,o=days.filter(x=>x!==d&&x<TODAY&&(parse(x).getDay()+6)%7===i);
      return {l:DL[i],v:ok?sp(d):0,hi:d===TODAY,fut:!ok,days:[d],t:`${DF[i]}, ${ddmm(d)}`,base:ok?avg(o.map(sp)):null}})}}
  chWkNow=null;
  /* semana: média = as outras semanas inteiras (7 dias no ciclo) já encerradas */
  if(chMode==='wk'){const W=[];let cur=null;days.forEach(d=>{if(!cur||(parse(d).getDay()+6)%7===0){cur=[];W.push(cur)}cur.push(d)});
    const tot=w=>w.reduce((a,d)=>a+(d<=TODAY?sp(d):0),0),fe=W.filter(w=>w.length===7&&w[6]<TODAY);
    return {bars:W.map(w=>({l:ddmm(w[0]),v:tot(w),hi:isNow&&TODAY>=w[0]&&TODAY<=w[w.length-1],fut:w[0]>TODAY,days:w.filter(d=>d<=TODAY),nd:w.length,t:w.length>1?`Semana de ${ddmm(w[0])} a ${ddmm(w[w.length-1])}`:`Dia ${ddmm(w[0])}`,base:avg(fe.filter(x=>x!==w).map(tot))}))}}
  /* mês: média = os outros ciclos do gráfico já encerrados */
  let bars=[];for(let k=-5;k<=0;k++){const c2=shiftCycle(cy,k);bars.push({l:c2.label.slice(0,3).toLowerCase(),v:calc(c2).vari,hi:k===0,cy:c2,t:`Ciclo de ${c2.label}`})}
  const first=bars.findIndex(b=>b.v>0);bars=bars.slice(Math.max(0,Math.min(first<0?3:first,3)));
  /* ciclo sem nenhum gasto (antes de começar a usar o app) não entra na média */
  bars.forEach(b=>{b.base=avg(bars.filter(x=>x!==b&&x.cy.end<TODAY&&x.v>.005).map(x=>x.v))});
  return {bars}}
/* v25: semanas do calendário (segunda a domingo) que tocam o ciclo, com os 7 dias de cada uma */
function chWeeks(cy){const W=[],e=cy.end;let d=parse(cy.start);d=new Date(d.getFullYear(),d.getMonth(),d.getDate()-(d.getDay()+6)%7);
  while(iso(d)<=e){const w=[];for(let i=0;i<7;i++)w.push(iso(new Date(d.getFullYear(),d.getMonth(),d.getDate()+i)));W.push(w);d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+7)}return W}
/* v25: comparação com a média do mesmo tipo (balão). Entre −5% e +5%: na média. Sem base: nada */
function chCmp(b){
  const hoje=b.cy?b.cy.start<=TODAY&&TODAY<=b.cy.end:(b.days||[]).includes(TODAY);
  /* v25 dev.2: na Semana e no Mês, a barra que contém hoje compara com a média proporcional ao tempo passado:
     base = média × (dias da barra até hoje, inclusive) ÷ (dias da barra) */
  if(hoje&&b.base!=null&&(b.cy||chMode==='wk')){const nd=(a,z)=>Math.round((parse(z)-parse(a))/864e5)+1;
    const f=b.cy?nd(b.cy.start,TODAY)/nd(b.cy.start,b.cy.end):b.days.length/b.nd;
    return chCmp0(Object.assign({},b,{base:b.base*f}),' até hoje')}
  const o=chCmp0(b);if(!o)return null;
  /* v25 dev.1: no Dia da semana, o dia de hoje ainda está pela metade: média inteira e avisa "até agora" */
  if(hoje){o.v+=' até agora';o.sr+=', até agora'}return o}
function chCmp0(b,q=''){if(b.base==null||b.fut)return null;const m=b.base,M=brl(m,0),p=m>.005?(b.v-m)/m*100:(b.v>.005?Infinity:0),r=Math.round(Math.abs(p)),de=q?`${q}, de ${M}`:` de ${M}`;
  if(!isFinite(p))return {k:'up',v:`▲ acima da média${q} (${M})`,sr:`acima da média${de}`};
  if(r<=5)return {k:'eq',v:`na média${q} (${M})`,sr:`na média${de}`};
  return p>0?{k:'up',v:`▲ ${r}% acima da média${q} (${M})`,sr:`${r} por cento acima da média${de}`}:{k:'dn',v:`▼ ${r}% abaixo da média${q} (${M})`,sr:`${r} por cento abaixo da média${de}`}}
/* balão da barra: onde foi o gasto, por categoria (as 5 maiores e o resto em "Outras") */

     Com 3 barras ou menos, ou barra no meio, o balão vai para baixo das barras */
  const al=n>3&&(i+1)/n<=.32?'r':n>3&&i/n>=.68?'l':'b';

/* Cartão */
/* fatura de um cartão: compras nele no período (estorno nele abate), parcelas e antecipações */
const isPay=(t,F)=>t.cat==='Pagar fatura'&&t.fat===F.id&&payCC(t)===F.cc;
function fatOf(F){const em=t=>!!F.cc&&t.meio===F.cc&&inC(t.d,F),f=S.tx.filter(t=>em(t)&&t.tipo==='out'&&!t.pid),est=S.tx.filter(t=>em(t)&&t.tipo==='in').reduce((a,t)=>a+t.v,0),p=parcFat(F),cr=f.reduce((a,t)=>a+t.v,0)-est,P=fatShift(F,-1),ro=S.tx.filter(t=>isPay(t,P)&&t.resto&&t.resto.k==='prox').reduce((a,t)=>a+t.resto.v,0);return {F,c:F,f,p,cr,ro,t:Math.max(0,cr+p.t+ro)}}
const dTo=d=>Math.round((d-parse(TODAY))/864e5);
/* compras parceladas em aberto: de um cartão (cc) ou de todos */
function parcStat(cc){return S.cfg.parcelas.filter(p=>p.v>0&&p.n>0&&!p.fim&&(!cc||pcc(p)===cc)).map(p=>{const k=pcc(p),Fn=fatNow(k),c0=fatById(p.fat1,k),ne=Math.max(0,p.n-antN(p)),pagas=Math.max(0,Math.min(ne,ymDiff(p.fat1,Fn.id))),rest=ne-pagas;return {...p,c0,ne,an:antN(p),cEnd:fatShift(c0,Math.max(0,ne-1)),pagas,rest,falta:rest*p.v,antOpen:(p.ant||[]).some(x=>fatOfDate(x.d,k).fe>=TODAY)}})}
/* situação da fatura: total (calculado ou o valor real informado), pago, crédito que sobrou da anterior e o que falta */
function fatStat(F,depth=0){const X=fatOf(F),r=(S.fat[fk(F)]||{}).real,tot=r!=null?r:X.t,pays=S.tx.filter(t=>isPay(t,F)),pago=pays.reduce((a,t)=>a+t.v,0),rol=pays.reduce((a,t)=>a+(t.resto?t.resto.v:0),0);
  let cred=0;if(depth<12){const P=fatStat(fatShift(F,-1),depth+1);cred=Math.max(0,P.pago+P.cred-P.tot)}
  const cob=pago+cred+rol;/* resto passado para a próxima fatura ou parcelado cobre esta */
  /* v21 lote 3a: "Faturas pagas até" (Ajustes › o cartão): conta como paga, sem criar pagamento nem mexer em entradas e saídas */
  const pa=F.cc&&(ctById(F.cc)||{}).pagasAte,pd=!!pa&&F.id<=pa;
  const st=TODAY<F.start?'futura':pd||cob>0&&cob>=tot-.005?'paga':TODAY<=F.fe?'aberta':tot<=.005?'paga':TODAY>F.ve?'atrasada':'fechada';
  return {...X,tot,real:r,pays,pago,rol,cred,falta:pd?0:Math.max(0,tot-cob),pd,fe:F.fe,ve:F.ve,st}}
let barSel=null;
/* faturas fechadas ou atrasadas com algo a pagar: de um cartão (cc) ou de todos */
function fatDue(cc){const L=[];(cc?[cc]:cards().map(k=>k.id)).forEach(id=>{const Fn=fatNow(id);for(let k=-6;k<=-1;k++){const s=fatStat(fatShift(Fn,k));if((s.st==='fechada'||s.st==='atrasada')&&s.falta>.005)L.push(s)}});return L}
/* limite usado: o que falta pagar das faturas já abertas ou fechadas, mais tudo o que já está nas faturas futuras */
function limUso(cc=curCC()){if(!cc)return 0;const Fn=fatNow(cc);let u=0;for(let k=-6;k<=0;k++)u+=fatStat(fatShift(Fn,k)).falta;for(let k=1;k<=48;k++)u+=fatOf(fatShift(Fn,k)).t;return u}
const ST={aberta:['aberta',''],paga:['paga ✓','ok'],fechada:['a pagar','w'],atrasada:['▲ atrasada','w'],futura:['prevista','']};
function vCartao(v){
  /* v24: sem cartão, estado vazio com o botão que abre a folha do cartão novo; com vários, seletor no topo */
  const C=cards();
  if(!C.length){v.innerHTML=head('<div class="h1">Cartão</div>')+`<div class="card ct-vz"><i class="face" aria-hidden="true"></i><div class="ct-vz-t">Nenhum cartão de crédito</div><p class="note" style="margin:0">Veja a fatura, o limite e as parcelas.</p><button class="btn p" type="button" data-act="addcard">Adicionar cartão de crédito</button></div>`;return}
  const cc=curCC(),K=cardOf(cc),dc=`data-cc="${esc(cc)}"`;
  const Fn=fatNow(cc),A=fatStat(Fn);

/* novo item de Contas e cartões: cria e abre a folha, com o nome selecionado para trocar */
function addCt(tp){const x={id:uid(),tipo:tp,nome:{conta:'Nova conta',credito:'Novo cartão',beneficio:'Novo benefício'}[tp]};if(!x.nome)return;
  if(tp==='conta'&&!contasB().length)x.pad=true;
  if(tp==='credito')Object.assign(x,{fecha:1,vence:10,limite:0},padId()?{paga:padId()}:{});
  if(tp==='beneficio')x.cats=alimIds();
  S.cfg.contas.push(x);store();renderTabs();sheetCt(S.cfg.contas.length-1);const f=$('#aj-n');if(f){f.focus();f.select()}}

/* ===== v24 lote 3a: primeira configuração (onboarding), PIN e tela de desbloqueio =====
   O PIN fica numa chave própria (jcoldus-pin), fora do backup: restaurar um backup nunca traz um PIN esquecido.
   Guarda só o hash SHA-256 de (sal aleatório + PIN), em base64. É uma trava de tela: os dados do app continuam
   no armazenamento do navegador sem criptografia (quem tem o aparelho aberto e as ferramentas do navegador lê). */
function sha256js(bytes){/* reserva para quando crypto.subtle não existe (fora de contexto seguro); mesmo resultado */
  const rr=(v,n)=>(v>>>n)|(v<<(32-n)),P=[],K=[],H=[];for(let c=2;P.length<64;c++)if(P.every(p=>c%p))P.push(c);
  P.forEach((p,i)=>{if(i<8)H[i]=(Math.pow(p,1/2)*4294967296)|0;K[i]=(Math.pow(p,1/3)*4294967296)|0});
  const l=bytes.length,n=((l+9+63)>>6)<<6,m=new Uint8Array(n);m.set(bytes);m[l]=0x80;const dv=new DataView(m.buffer);dv.setUint32(n-8,Math.floor(l/0x20000000));dv.setUint32(n-4,(l<<3)>>>0);
  const W=new Array(64);
  for(let o=0;o<n;o+=64){for(let i=0;i<16;i++)W[i]=dv.getUint32(o+i*4)|0;
    for(let i=16;i<64;i++){const a=W[i-15],b=W[i-2];W[i]=(W[i-16]+(rr(a,7)^rr(a,18)^(a>>>3))+W[i-7]+(rr(b,17)^rr(b,19)^(b>>>10)))|0}
    let [a,b,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){const t1=(h+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[i]+W[i])|0,t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&b)^(a&c)^(b&c)))|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0}
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0}
  const out=new Uint8Array(32),ov=new DataView(out.buffer);H.forEach((x,i)=>ov.setUint32(i*4,x>>>0));return out}
async function sha(bytes){try{if(window.crypto&&crypto.subtle&&crypto.subtle.digest)return new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))}catch(e){}return sha256js(bytes)}
const PINK='jcoldus-pin',b64=u=>btoa(String.fromCharCode(...u)),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
/* PWA: o PIN (só o hash com sal) mora no IndexedDB, na mesma chave de antes (ver JCDB) */
const pinGet=()=>{try{const p=JSON.parse(JCDB.get(PINK)||'null');return p&&p.s&&p.h?p:null}catch(e){return null}};
async function pinHash(pin,s){const a=unb64(s),b=new TextEncoder().encode(String(pin)),m=new Uint8Array(a.length+b.length);m.set(a);m.set(b,a.length);return b64(await sha(m))}
async function pinSave(pin){const s=b64(crypto.getRandomValues(new Uint8Array(16))),h=await pinHash(pin,s);try{JCDB.set(PINK,JSON.stringify({v:1,s,h}));return (await JCDB.flush())!==false}catch(e){return false}}
async function pinCheck(pin){const p=pinGet();return !!p&&(await pinHash(pin,p.s))===p.h}
/* sem PIN não há Face ID nem Touch ID: o PIN é a reserva obrigatória */
const pinDel=()=>{try{JCDB.del(PINK);JCDB.del(BIOK)}catch(e){}};

/* ===== PWA: Face ID e Touch ID (WebAuthn, chave de acesso do próprio aparelho) =====
   Só desbloqueia: precisa do PIN ligado, e o PIN continua valendo. Não há servidor: o app guarda o id da credencial e a chave
   pública (em jcoldus-bio) e confere no aparelho o desafio, a origem, a verificação do usuário (Face ID, Touch ID ou senha do
   aparelho) e a assinatura. Só aparece quando o navegador tem o recurso, em https ou localhost. É trava de tela, não criptografia. */
const BIOK='jcoldus-bio';let BIO_OK=false;
const bioGet=()=>{try{const b=JSON.parse(JCDB.get(BIOK)||'null');return b&&b.id?b:null}catch(e){return null}};
const b64url=u=>b64(u).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
/* WebAuthn não aceita endereço numérico (IP): nele o recurso não aparece */
(async()=>{try{BIO_OK=!!(window.isSecureContext&&!/^[\d.]+$|^\[/.test(location.hostname)&&window.PublicKeyCredential&&navigator.credentials&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch(e){BIO_OK=false}
  if(!BIO_OK)return;if(LOCKED&&!lockF&&bioGet())lockRender();if($('#aj-voce')&&$('#sheet').classList.contains('on')&&pinGet()&&!$('#aj-bio'))sheetAjustes('voce')})();
async function bioOn(){if(!BIO_OK||!pinGet())return;
  let c=null;try{c=await navigator.credentials.create({publicKey:{rp:{name:'J-Coldus'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'J-Coldus',displayName:S.cfg.nome||'J-Coldus'},
    challenge:crypto.getRandomValues(new Uint8Array(32)),pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
    authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000,attestation:'none'}})}
  catch(e){toast(e&&e.name==='NotAllowedError'?'Face ID ou Touch ID não foi ligado':'Este aparelho não deixou ligar Face ID ou Touch ID');return}
  if(!c)return;let pk=null,alg=null;
  try{const r=c.response;if(r.getPublicKey){const k=r.getPublicKey();if(k)pk=b64(new Uint8Array(k))}if(r.getPublicKeyAlgorithm)alg=r.getPublicKeyAlgorithm()}catch(e){}
  JCDB.set(BIOK,JSON.stringify({v:1,id:b64(new Uint8Array(c.rawId)),pk,alg}));sheetAjustes('voce');toast('Face ID ou Touch ID ligado')}
/* assinatura ECDSA vem em DER; o WebCrypto quer r||s (64 bytes) */
function derRaw(d){let i=2;if(d[1]&0x80)i+=d[1]&0x7f;const p=()=>{i++;const n=d[i++];let v=d.slice(i,i+n);i+=n;while(v.length>32&&v[0]===0)v=v.slice(1);const o=new Uint8Array(32);o.set(v,32-v.length);return o};
  const r=p(),s=p(),o=new Uint8Array(64);o.set(r);o.set(s,32);return o}
async function bioValida(b,a,ch){try{
  if(b64(new Uint8Array(a.rawId))!==b.id)return false;
  const r=a.response,cd=JSON.parse(new TextDecoder().decode(r.clientDataJSON));
  if(cd.type!=='webauthn.get'||cd.challenge!==b64url(ch)||cd.origin!==location.origin)return false;
  const ad=new Uint8Array(r.authenticatorData);if(ad.length<37||!(ad[32]&1)||!(ad[32]&4))return false;/* bits UP (presença) e UV (verificação) */
  if(b.pk&&b.alg===-7){const k=await crypto.subtle.importKey('spki',unb64(b.pk),{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
    const h=new Uint8Array(await crypto.subtle.digest('SHA-256',r.clientDataJSON)),m=new Uint8Array(ad.length+32);m.set(ad);m.set(h,ad.length);
    return await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},k,derRaw(new Uint8Array(r.signature)),m)}
  return true}catch(e){return false}}
async function bioUnlock(){const b=bioGet();if(!b||!BIO_OK||!LOCKED||!PE)return;const ch=crypto.getRandomValues(new Uint8Array(32));let a=null;
  try{a=await navigator.credentials.get({publicKey:{challenge:ch,allowCredentials:[{type:'public-key',id:unb64(b.id)}],userVerification:'required',timeout:60000}})}
  catch(e){if(PE){PE.err=e&&e.name==='NotAllowedError'?'':'Face ID ou Touch ID não funcionou. Use o PIN.';pinUpd()}return}
  if(a&&await bioValida(b,a,ch))unlock();else if(PE){PE.err='Face ID ou Touch ID não confirmou. Use o PIN.';pinUpd()}}

/* teclado do PIN (próprio do app, sem teclado do sistema). PE = entrada em curso:
   ctx 'onb' (configuração), 'lock' (desbloqueio) ou 'aj' (Ajustes); st 'cur' (PIN atual), 'set' (novo) ou 'conf' (repetir) */
let PE=null;
const pinDotsH=()=>[0,1,2,3].map(i=>`<i class="${i<PE.a.length?'on':''}"></i>`).join('');
const pinPad=()=>`<div class="pdots" id="pdots" role="img" aria-label="${PE.a.length} de 4 números">${pinDotsH()}</div>
   <p class="perr" id="perr" role="alert">${esc(PE.err||'')}</p>
   <div class="pkeys" role="group" aria-label="Teclado do PIN">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-act="pk" data-v="${n}">${n}</button>`).join('')}<span aria-hidden="true"></span><button type="button" data-act="pk" data-v="0">0</button><button type="button" class="pdel" data-act="pk" data-v="del" aria-label="Apagar">${BACK}</button></div>`;
function pinUpd(){const d=$('#pdots');if(!d||!PE)return;d.innerHTML=pinDotsH();d.setAttribute('aria-label',PE.a.length+' de 4 números');const e=$('#perr');if(e)e.textContent=PE.err||''}
function pinShake(msg){PE.err=msg;pinUpd();const d=$('#pdots');if(d){d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake')}}
const pinView=()=>!PE?0:PE.ctx==='onb'?onbRender():PE.ctx==='lock'?lockRender():sheetPin();
async function pinKey(v){if(!PE||PE.busy)return;
  if(v==='del'){PE.a=PE.a.slice(0,-1);PE.err='';pinUpd();return}
  if(PE.a.length>=4)return;PE.a+=v;PE.err='';pinUpd();if(PE.a.length<4)return;
  PE.busy=true;await new Promise(r=>setTimeout(r,140));const P=PE,a=P.a;P.a='';
  try{await pinDone(P,a)}finally{P.busy=false}}
async function pinDone(P,a){
  if(P.st==='cur'){if(!(await pinCheck(a))){pinShake('PIN errado. Tente de novo.');return}
    if(P.ctx==='lock'){unlock();return}
    if(P.mode==='off'){pinDel();ajPinFim('PIN desligado');return}
    P.st='set';P.err='';pinView();return}
  if(P.st==='set'){P.first=a;P.st='conf';P.err='';pinView();return}
  if(a!==P.first){P.st='set';P.first='';pinView();pinShake('Os dois PINs ficaram diferentes. Crie de novo.');return}
  P.first='';if(!(await pinSave(a))){pinShake('Não deu para guardar o PIN neste aparelho.');return}
  if(P.ctx==='onb'){PE=null;onbGo(1)}else ajPinFim(P.mode==='chg'?'PIN trocado':'PIN ligado')}
/* Ajustes: ligar, trocar (pede o atual) e desligar (pede o atual) */
function sheetPin(){const P=PE,t=P.mode==='off'?'Desligar PIN':P.mode==='chg'?'Trocar PIN':'Ligar PIN';
  const h=P.st==='cur'?'Digite o PIN atual':P.st==='conf'?'Digite o novo PIN de novo':P.mode==='chg'?'Crie o novo PIN':'Crie um PIN de 4 números';
  ajCur=null;ajOpen(ajTop(t)+`<p id="pinh" style="margin:8px 0 0;text-align:center;font-size:16px">${h}</p>${pinPad()}<p class="note" style="text-align:center">Se esquecer o PIN, só dá para entrar restaurando um backup: não tem outro jeito de recuperar.</p>`)}
function ajPinFim(msg){PE=null;sheetAjustes('voce');toast(msg)}

/* tela de desbloqueio: com PIN ligado o app abre nela, sem desenhar nenhum dado antes do PIN certo */
let LOCKED=false,lockF=null;
function lockShow(){LOCKED=true;PE={ctx:'lock',st:'cur',a:'',err:''};lockF=null;let el=$('#lock');
  if(!el){el=document.createElement('section');el.id='lock';el.className='onb lock';el.setAttribute('aria-labelledby','lockh');$('#phone').appendChild(el)}
  $('#phone').classList.add('onb-on');lockRender()}
function lockRender(){const el=$('#lock');if(!el)return;
  if(lockF){const j=lockF.j,e=j?(j.estado||{cfg:j.config||{},tx:j.lancamentos||[]}):null;
    el.innerHTML=`<div class="onb-top"><button class="navb" type="button" data-act="lockback" aria-label="Voltar ao PIN">‹</button><span></span><span></span></div>
     <div class="onb-body"><h1 id="lockh">Esqueceu o PIN?</h1><p>Não tem outro jeito de recuperar o PIN. Para entrar, restaure um backup seu.</p>
     <div class="onb-note"><b>O que acontece</b><span>O backup substitui tudo o que está neste celular. O PIN é desligado, e você pode criar outro em Ajustes.</span></div>
     ${j?`<div class="onb-note" id="lock-prev"><b>Backup${j.exportado?' de '+ddmm(j.exportado)+'/'+j.exportado.slice(0,4):''}</b><span>${pl((e.tx||[]).length,'lançamento','lançamentos')} e ${pl(((e.cfg||{}).rendas||[]).length,'renda','rendas')}.</span></div>`:''}
     <p class="perr" id="lockerr" role="alert">${esc(lockF.err||'')}</p></div>
     <div class="onb-ft">${j?`<button class="btn d" type="button" data-act="lockrest">Restaurar backup</button>`:''}<label class="btn ${j?'':'p '}filebtn">${j?'Escolher outro arquivo':'Escolher o arquivo de backup'}<input type="file" id="lock-fbk" accept=".json,application/json"></label>${j?'':'<button class="lnk t44" type="button" data-act="lockback">Voltar ao PIN</button>'}</div>`;
    const h=$('#lockh');h.tabIndex=-1;h.focus({preventScroll:true});onbFt(el);return}
  el.innerHTML=`<div class="onb-body"><div class="lk-logo">${LOGO}</div><h1 id="lockh">Digite seu PIN</h1>${pinPad()}</div>
   <div class="onb-ft">${BIO_OK&&bioGet()?'<button class="btn" type="button" data-act="biolock">Usar Face ID ou Touch ID</button>':''}<button class="lnk t44" type="button" data-act="lockforgot">Esqueci o PIN</button></div>`;onbFt(el)}
/* v24 lote 3b: com PIN ligado, app escondido por mais de 2 minutos volta à tela do PIN (e some o que estava na tela) */
const LOCK_MS=120000;let hidAt=0;
document.addEventListener('visibilitychange',()=>{if(document.hidden){hidAt=Date.now();return}
  const t=hidAt;hidAt=0;if(!t||LOCKED||!pinGet()||Date.now()-t<=LOCK_MS)return;
  if($('#sheet').classList.contains('on'))closeSheet();if(ONB)onbClose();hideToast();
  $('#view').innerHTML='';$('#tabs').innerHTML='';lockShow()});
function unlock(){LOCKED=false;PE=null;lockF=null;const el=$('#lock');if(el)el.remove();$('#phone').classList.remove('onb-on');boot()}

/* primeira configuração em telas cheias. Cada modo tem a sua sequência de passos (as listas abaixo); cada passo é uma
   função em OS que devolve o corpo, a base (botões) e, se o passo for opcional, o rótulo do "Pular" do topo.
   v24 lote 3b: depois da conta, cartão, benefício, rendas, contas fixas, aporte e "Pronto". Só a conta é obrigatória.
   No "Refazer", os passos mostram o que já existe e só acrescentam (nome repetido não entra de novo). */
let ONB=null;
const ONB_REST=['contas','cartao','beneficio','rendas','fixos','aporte','pronto'];
const ONB_FLOW={first:['boas','nome','pin',...ONB_REST],zero:['boas','nome','pin',...ONB_REST],redo:['nome','pin',...ONB_REST]};
const onbSteps=()=>ONB_FLOW[ONB.mode]||ONB_FLOW.first,onbStep=()=>onbSteps()[ONB.i];
function onbOpen(mode,i=0){ONB={mode,i:0,err:'',sel:{}};ONB.i=Math.max(0,Math.min(onbSteps().length-1,+i||0));PE=null;
  if(mode!=='redo'){S.onb={m:mode,i:ONB.i};store()}
  let el=$('#onb');if(!el){el=document.createElement('section');el.id='onb';el.className='onb';el.setAttribute('aria-labelledby','onbh');$('#phone').appendChild(el)}
  $('#phone').classList.add('onb-on');onbRender()}
function onbClose(){ONB=null;PE=null;const el=$('#onb');if(el)el.remove();if(!LOCKED)$('#phone').classList.remove('onb-on')}
function onbFinish(){delete S.onb;onbClose();resetL();tab='mes';cyOff=0;store();render();$('#view').scrollTop=0}
/* sai do passo atual (guardando o que foi digitado) e vai para o seguinte (d=1) ou o anterior (d=-1) */
function onbGo(d){const id=onbStep();
  if(id==='nome'){const f=$('#onb-nome');if(f){const v=f.value.trim().slice(0,30);if(v)S.cfg.nome=v;else delete S.cfg.nome;store()}}
  ONB.err='';ONB.sel={};PE=null;ONB.i+=d;
  if(ONB.i<0){if(ONB.mode==='redo'){onbClose();render();sheetAjustes('voce')}else ONB.i=0;if(!ONB)return}
  if(ONB.i>=onbSteps().length){onbFinish();return}
  if(S.onb){S.onb.i=ONB.i;store()}
  onbRender()}
/* aviso de erro do passo: rola só o corpo da tela até ele (scrollIntoView rolaria também a moldura e esconderia o topo) */
const onbErr=m=>{ONB.err=m;const e=$('#onb-err');if(!e)return;e.textContent=m;const bd=e.closest('.onb-body');if(!m||!bd)return;
  const r=e.getBoundingClientRect(),q=bd.getBoundingClientRect();if(r.bottom>q.bottom)bd.scrollTop+=r.bottom-q.bottom+8;else if(r.top<q.top)bd.scrollTop-=q.top-r.top+8};
const onbV=id=>String(($('#'+id)||{}).value||'').trim();
/* dia do mês digitado: null = vazio; NaN = inválido */
const onbDia=id=>{const s=onbV(id);if(!s)return null;return /^\d{1,2}$/.test(s)&&+s>=1&&+s<=31?+s:NaN};
/* valor digitado: null = vazio; NaN = inválido */
const onbNum=id=>{const s=onbV(id);if(!s)return null;const n=pnum(s);return n>=0?n:NaN};
/* saldo de hoje informado: ponto de partida da conta ou do benefício (o que já foi lançado hoje fica de fora) */
const onbSaldo=v=>({v,d:TODAY,ex:[...S.tx.filter(t=>t.d===TODAY).map(t=>t.id),...S.tx.flatMap(t=>(t.div||[]).flatMap(y=>(y.rec||[]).filter(r=>r.d===TODAY).map(r=>r.id)))]});
/* "Contas": cria a conta digitada (a primeira é a padrão do Lançar), com o saldo de hoje se informado */
function onbAddCt(){const nome=onbV('onb-cn').slice(0,30);if(!nome){onbErr('Escreva o nome de uma conta ou toque num atalho.');return false}
  if(contasB().some(x=>nrm(x.nome)===nrm(nome))){onbErr('Já existe uma conta com esse nome.');return false}
  const x={id:uid(),tipo:'conta',nome};if(!contasB().length)x.pad=true;
  const raw=onbV('onb-cs'),n=pnum(raw.replace(/^[−-]/,''));
  if(raw&&isNaN(n)){onbErr('O saldo precisa ser um número, como 1.250,00.');return false}
  if(raw)x.saldo=onbSaldo(/^[−-]/.test(raw)?-n:n);
  S.cfg.contas.push(x);migrate();store();return true}
/* cada passo opcional: devolve null (nada digitado), false (erro, já avisado) ou true (item criado) */
const ONB_ADD={
  contas:()=>onbV('onb-cn')?onbAddCt():null,
  cartao:()=>{const nome=onbV('onb-kn').slice(0,30),lim=onbNum('onb-kl'),fe=onbDia('onb-kf'),ve=onbDia('onb-kv');
    if(!nome){if(lim!=null||fe!=null||ve!=null){onbErr('Escreva o nome do cartão ou toque num atalho.');return false}return null}
    if(cards().some(x=>nrm(x.nome)===nrm(nome))){onbErr('Já existe um cartão com esse nome.');return false}
    if(Number.isNaN(lim)){onbErr('O limite precisa ser um número, como 3.000,00.');return false}
    if(!(fe>0)||!(ve>0)){onbErr('Diga o dia em que a fatura fecha e o dia em que vence (de 1 a 31).');return false}
    const pg=ctById(ONB.sel.paga)?ONB.sel.paga:padId();
    S.cfg.contas.push({id:uid(),tipo:'credito',nome,fecha:fe,vence:ve,limite:lim||0,...(pg?{paga:pg}:{})});migrate();store();return true},
  beneficio:()=>{const nome=onbV('onb-bn').slice(0,30),v=onbNum('onb-bv'),dia=onbDia('onb-bd'),sraw=onbV('onb-bs'),s=onbNum('onb-bs');
    if(!nome){if(v!=null||dia!=null||sraw){onbErr('Escreva o nome do benefício ou toque num atalho.');return false}return null}
    if(bens().some(x=>nrm(x.nome)===nrm(nome))){onbErr('Já existe um benefício com esse nome.');return false}
    if(!(v>0)){onbErr('Diga quanto cai por mês, como 600,00.');return false}
    if(!(dia>0)){onbErr('Diga o dia em que o valor cai (de 1 a 31).');return false}
    if(Number.isNaN(s)){onbErr('O saldo precisa ser um número, como 250,00.');return false}
    const b={id:uid(),tipo:'beneficio',nome,cats:alimIds(),...(s!=null?{saldo:onbSaldo(s)}:{})};
    S.cfg.contas.push(b);
    /* regra da casa: o benefício conta como renda, sempre (cai no próprio benefício) */
    if(!S.cfg.rendas.some(r=>r.meio===b.id))S.cfg.rendas.push({id:uid(),nome,v,dia,meio:b.id});
    migrate();store();return true},
  rendas:()=>{const nome=onbV('onb-rn').slice(0,30),v=onbNum('onb-rv'),dia=onbDia('onb-rd');
    if(!nome){if(v!=null||dia!=null){onbErr('Escreva o nome da renda ou toque num atalho.');return false}return null}
    if(S.cfg.rendas.some(x=>nrm(x.nome)===nrm(nome))){onbErr('Já existe uma renda com esse nome.');return false}
    if(!(v>0)){onbErr('Diga quanto entra por mês, como 3.500,00.');return false}
    if(!(dia>0)){onbErr('Diga o dia em que o dinheiro cai (de 1 a 31).');return false}
    const m=ctById(ONB.sel.rmeio)?ONB.sel.rmeio:padId();

  else if(a==='onbrm'){const k=b.dataset.k,id=b.dataset.v,L_=k==='r'?S.cfg.rendas:k==='f'?S.cfg.fixos:S.cfg.contas,x=L_.find(y=>y.id===id);if(!x)return;
    if(k==='ct'&&x.tipo==='conta'&&contasB().length<2)return;
    if(!armed(b,'Remover?','Toque de novo para remover '+x.nome))return;
    const und=snapUndo();
    if(k==='ct'){S.tx.forEach(t=>{if(t.meio===x.id)t.mn=ctNome(x)});if(x.tipo==='beneficio')S.cfg.rendas=S.cfg.rendas.filter(r=>r.meio!==x.id);else S.cfg.rendas.forEach(r=>{if(r.meio===x.id)delete r.meio})}
    L_.splice(L_.indexOf(x),1);ONB.dirty=true;migrate();store();onbRender();toast('Removido: '+x.nome,()=>{und();migrate();setTimeout(onbRender,0)})}
  else if(a==='onbback')onbGo(-1);
  else if(a==='onbskip')onbGo(1);
  else if(a==='pinredo'){PE={ctx:'onb',st:'set',a:'',err:''};onbRender()}
  else if(a==='onbex'){S=seed();migrate();S.ini=TODAY;exAjuste();onbFinish()}
  else if(a==='onbchip'){const f=$('#'+(b.dataset.f||'onb-cn'));if(f){f.value=b.dataset.v;f.dispatchEvent(new Event('input',{bubbles:true}));b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'))}onbErr('')}
  else if(a==='onbaddct'){if(onbAddCt()){onbRender();const f=$('#onb-cn');if(f)f.focus()}}
  else if(a==='onbredo'){closeSheet();onbOpen('redo')}
  else if(a==='pinon'||a==='pinchg'||a==='pinoff'){ajScroll=$('#sheet').scrollTop;PE={ctx:'aj',mode:a.slice(3),st:a==='pinon'?'set':'cur',a:'',err:''};sheetPin()}
  else if(a==='lockforgot'){lockF={};lockRender()}
  else if(a==='bioon')bioOn();
  else if(a==='biooff'){JCDB.del(BIOK);sheetAjustes('voce');toast('Face ID ou Touch ID desligado')}
  else if(a==='biolock')bioUnlock();
  else if(a==='lockback'){lockF=null;PE={ctx:'lock',st:'cur',a:'',err:''};lockRender()}
  else if(a==='lockrest'){const j=lockF&&lockF.j;if(!j)return;if(!armed(b,'Toque de novo para substituir tudo'))return;
    if(!restore(j)){lockF={err:'Backup inválido: faltam dados.'};lockRender();return}
    pinDel();delete S.onb;store();resetL();tab='mes';unlock();toast('Backup restaurado. O PIN foi desligado: crie outro em Ajustes, se quiser.')}});
document.addEventListener('change',e=>{const el=e.target;
  if(el.id==='aj-nome'){const v=el.value.trim().slice(0,30);if(v)S.cfg.nome=v;else delete S.cfg.nome;el.value=v;store();return}
  if(el.id==='onb-fbk'&&el.files&&el.files[0]){readBk(el.files[0],j=>{if(j&&restore(j)){delete S.onb;onbFinish();toast('Backup restaurado')}else{onbErr('Este arquivo não é um backup do J-Coldus.');el.value=''}});return}
  if(el.id==='lock-fbk'&&el.files&&el.files[0]){readBk(el.files[0],j=>{lockF=j?{j}:{err:'Este arquivo não é um backup do J-Coldus.'};lockRender()});return}});
document.addEventListener('keydown',e=>{
  /* teclado físico (computador) também digita o PIN */
  if(PE&&$('#pdots')&&!e.target.closest('input,textarea,select')){if(/^[0-9]$/.test(e.key)){e.preventDefault();pinKey(e.key);return}if(e.key==='Backspace'){e.preventDefault();pinKey('del');return}}

  /* aporte: nome e valor gravam na hora (trocar o modo redesenha a tela sem perder o que foi digitado) */
  if(el.id==='onb-an'||el.id==='onb-av'){const A=S.cfg.aporte;if(el.id==='onb-an'){A.nome=el.value.trim().slice(0,30);document.querySelectorAll('#onb [data-act="onbap"][data-f="nome"]').forEach(x=>x.setAttribute('aria-pressed',nrm(x.dataset.v)===nrm(A.nome)?'true':'false'))}
    else if(A.modo==='fixo'){const n=pnum(el.value);A.valor=n>=0?n:0}else{const n=parseInt(el.value,10);if(n>=0&&n<=100)S.cfg.metaPct=n}
    ONB.dirty=true;S.metaLock=S.metaLock||{};delete S.metaLock[apPer(TODAY).key];store()}});
/* teclado do sistema aberto (iPhone): a base das telas cheias sobe junto, para o botão principal não ficar atrás dele */
if(window.visualViewport){const vv=window.visualViewport,kb=()=>document.documentElement.style.setProperty('--kb',Math.max(0,Math.round(window.innerHeight-vv.height-vv.offsetTop))+'px');vv.addEventListener('resize',kb);vv.addEventListener('scroll',kb)}
function boot(){if(S.onb&&!ONB)onbOpen(S.onb.m||'first',S.onb.i||0);else render()}
migrate();
if(pinGet())lockShow();else boot();
